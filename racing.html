<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes Racing Minigame</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: #2a2a2a;
            --text-main: #f0f0f0;
            --text-muted: #999;
            --accent-red: #ee382b;
            --accent-green: #84ee64;
            --border-color: #444;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 2px solid var(--accent-red); margin-bottom: 20px; }
        h1 { margin: 0; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; }
        
        .account-info { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
        .ip-display { font-size: 12px; color: var(--text-muted); font-family: monospace; }
        .balance-display { font-size: 20px; font-weight: bold; color: var(--accent-green); background: #111; padding: 10px 20px; border-radius: 5px; border: 1px solid var(--border-color); }
        
        nav { margin-bottom: 20px; }
        nav a { padding: 10px 20px; background: #333; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; margin-right: 10px; border: 1px solid var(--border-color); }
        nav a.active { background: var(--accent-red); border-color: var(--accent-red); }

        .race-container { display: flex; gap: 20px; flex: 1; min-height: 0; }
        
        /* Your custom track image is set as the background here */
        .track-panel { 
            flex: 3; 
            background-color: #1e3a1e; 
            background-image: url('track_bg.png'); 
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
            position: relative; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        
        #track-svg { width: 100%; height: 100%; }
        
        .car { 
            offset-anchor: center;
            transform-box: fill-box;
            transform-origin: center;
            /* All offset lanes removed so cars stack perfectly on top of each other */
        }

        .betting-panel { flex: 1; background: var(--panel-bg); border-radius: 8px; border: 1px solid var(--border-color); padding: 20px; display: flex; flex-direction: column; overflow-y: auto; }
        .betting-panel h2 { margin-top: 0; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .betting-panel p { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; }
        .betting-panel select, .betting-panel input { width: 100%; padding: 10px; margin-bottom: 15px; background: #111; color: white; border: 1px solid #555; border-radius: 4px; }
        .betting-panel button { width: 100%; padding: 12px; background: var(--accent-green); color: black; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; text-transform: uppercase; }
        .betting-panel button:disabled { background: #555; cursor: not-allowed; }

        #raceResult { margin-top: 20px; font-weight: bold; font-size: 18px; text-align: center; min-height: 30px; }
    </style>
</head>
<body>

    <header>
        <h1>Hermes Live Sportsbook</h1>
        <div class="account-info">
            <div class="ip-display" id="userIp">Connecting...</div>
            <div class="balance-display">Balance: $<span id="balance">0.00</span></div>
        </div>
    </header>

    <nav>
        <a href="/">Live Scoreboard</a>
        <a href="/racing" class="active">Racing Minigame (4.0x Odds)</a>
    </nav>

    <div class="race-container">
        <div class="track-panel">
            <svg id="track-svg" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet">
                
                <!-- The Invisible Guide Rail the cars actually follow. 
                     Currently set to red stroke so you can see it while you draw/align your SVG path to the background image.
                     Change to 'transparent' when finished. -->
                <path id="invisible-guide-line" fill="none" stroke="red" stroke-width="2" />
                
                <!-- Cars are now perfect circles -->
                <circle id="car-Red" class="car" fill="#ff4444" r="10" />
                <circle id="car-Blue" class="car" fill="#4444ff" r="10" />
                <circle id="car-Green" class="car" fill="#44ff44" r="10" />
                <circle id="car-Yellow" class="car" fill="#ffff44" r="10" />
            </svg>
        </div>

        <div class="betting-panel">
            <h2>Place Race Bet</h2>
            <p>Select a car. Winner pays 4.0x your wager. Race takes place on the custom circuit.</p>
            
            <label>Select Car:</label>
            <select id="carSelect">
                <option value="Red">Red Car</option>
                <option value="Blue">Blue Car</option>
                <option value="Green">Green Car</option>
                <option value="Yellow">Yellow Car</option>
            </select>

            <label>Wager Amount:</label>
            <input type="number" id="betAmount" placeholder="Enter amount ($)" min="1">
            
            <button id="startRaceBtn">Lock Bet & Start Race</button>
            <div id="raceResult"></div>
        </div>
    </div>

    <script>
        const balanceEl = document.getElementById('balance');
        const userIpEl = document.getElementById('userIp');
        const startBtn = document.getElementById('startRaceBtn');
        const resultDisplay = document.getElementById('raceResult');
        let currentAnimations = [];

        // Replace this path string with your new custom path you trace over the PNG image
        const customGuidePath = "M 350 460 L 120 440 C 40 430, 30 280, 70 200 C 90 150, 160 150, 200 120 C 260 70, 290 40, 360 40 L 680 40 C 700 40, 710 70, 730 70 C 750 70, 760 40, 780 40 C 910 40, 940 150, 830 230 C 770 280, 720 290, 700 330 C 680 370, 700 400, 740 400 L 920 400 C 970 400, 970 460, 920 460 L 630 460 C 580 460, 620 330, 530 330 C 430 330, 450 460, 350 460 Z";
        const pathStr = `path('${customGuidePath}')`;

        async function fetchAccount() {
            try {
                const response = await fetch('/api/account');
                const data = await response.json();
                if (data.ip) {
                    userIpEl.textContent = `User IP: ${data.ip}`;
                    balanceEl.textContent = data.account.balance.toFixed(2);
                }
            } catch (err) {
                console.error("Failed to fetch account data");
            }
        }

        function resetBoard() {
            currentAnimations.forEach(anim => anim.cancel());
            currentAnimations = [];

            document.getElementById('invisible-guide-line').setAttribute('d', customGuidePath);
            
            const cars = ["Red", "Blue", "Green", "Yellow"];
            cars.forEach(c => {
                const el = document.getElementById(`car-${c}`);
                el.style.offsetPath = pathStr;
                el.style.offsetDistance = '0%';
            });
        }

        fetchAccount();
        resetBoard();

        startBtn.addEventListener('click', async () => {
            const car = document.getElementById('carSelect').value;
            const amount = parseFloat(document.getElementById('betAmount').value);
            const currentBalance = parseFloat(balanceEl.textContent);
            
            if (isNaN(amount) || amount <= 0) return alert('Enter a valid bet amount.');
            if (amount > currentBalance) return alert('Insufficient funds!');

            startBtn.disabled = true;
            resultDisplay.textContent = "Racing...";
            resultDisplay.style.color = "var(--text-main)";
            
            balanceEl.textContent = (currentBalance - amount).toFixed(2);
            resetBoard();
            
            try {
                const response = await fetch('/api/race', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ car: car, amount: amount })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    alert(data.error);
                    balanceEl.textContent = currentBalance.toFixed(2);
                    startBtn.disabled = false;
                    resultDisplay.textContent = "";
                    return;
                }

                const cars = ["Red", "Blue", "Green", "Yellow"];
                let maxDuration = 0;

                cars.forEach(c => {
                    const el = document.getElementById(`car-${c}`);
                    const isWinner = (c === data.winner);
                    
                    const finalDistance = isWinner ? 100 : (Math.random() * 9 + 88); 
                    const duration = 6500 + (Math.random() * 2000);
                    if (duration > maxDuration) maxDuration = duration;

                    let p1 = 20 + (Math.random() * 12 - 6);
                    let p2 = 50 + (Math.random() * 15 - 7);
                    let p3 = 75 + (Math.random() * 10 - 5);
                    if (p3 >= finalDistance) p3 = finalDistance - 2;

                    const keyframes = [
                        { offsetDistance: '0%', offset: 0 },
                        { offsetDistance: `${p1}%`, offset: 0.25 },
                        { offsetDistance: `${p2}%`, offset: 0.5 },
                        { offsetDistance: `${p3}%`, offset: 0.75 },
                        { offsetDistance: `${finalDistance}%`, offset: 1 }
                    ];

                    const animation = el.animate(keyframes, {
                        duration: duration,
                        easing: 'ease-in-out',
                        fill: 'forwards'
                    });
                    
                    animation.onfinish = () => el.style.offsetDistance = `${finalDistance}%`;
                    currentAnimations.push(animation);
                });

                setTimeout(() => {
                    balanceEl.textContent = data.account.balance.toFixed(2);
                    
                    if (data.payout > 0) {
                        resultDisplay.style.color = "var(--accent-green)";
                        resultDisplay.textContent = `WIN! +$${data.payout.toFixed(2)}`;
                    } else {
                        resultDisplay.style.color = "var(--accent-red)";
                        resultDisplay.textContent = `LOSS. Winner was ${data.winner}.`;
                    }
                    startBtn.disabled = false;
                }, maxDuration + 100);

            } catch (err) {
                alert('Failed to place bet. Check connection.');
                balanceEl.textContent = currentBalance.toFixed(2);
                startBtn.disabled = false;
                resultDisplay.textContent = "";
            }
        });
    </script>
</body>
</html>
